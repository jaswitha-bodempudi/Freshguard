<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshGuard - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #f1f8e9
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;

            margin: 0;

            color: #2e7d32;

            font-size: 30px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-top: 8px;
            margin-bottom: 28px;

            font-size: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #333;

            font-weight: bold;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d0d0d0;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #2e7d32;

            box-shadow:
                0 0 0 3px
                rgba(46, 125, 50, 0.10);
        }

        .login-button {
            width: 100%;

            padding: 13px;

            margin-top: 8px;

            border: none;

            border-radius: 8px;

            background: #2e7d32;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {
            background: #1b5e20;
        }

        .error-message {
            background: #ffebee;

            color: #c62828;

            border: 1px solid #ef9a9a;

            border-radius: 8px;

            padding: 12px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 14px;
        }

        .register-section {
            text-align: center;

            margin-top: 24px;

            color: #666;

            font-size: 14px;
        }

        .register-section a {
            color: #2e7d32;

            text-decoration: none;

            font-weight: bold;
        }

        .register-section a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                🥦
            </div>

            <h1>
                FreshGuard
            </h1>

            <p class="subtitle">
                AI-Based Food Expiry & Waste Management
            </p>


            {% if error %}

                <div class="error-message">

                    {{ error }}

                </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for('login') }}"
            >

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <div class="register-section">

                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Create an account
                </a>

            </div>

        </div>

    </div>

</body>

</html>
